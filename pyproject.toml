[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tinywatch-grpo"
version = "0.1.0"
description = "TinyWatch watchlist-agent post-training: Flash teacher, Action-only SFT, lightweight GRPO"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "tqdm>=4.66,<5",
]

[project.optional-dependencies]
sft = [
  "torch>=2.5",
  "transformers>=4.51",
  "peft>=0.15,<1",
  "accelerate>=1,<2",
]
grpo = [
  "torch>=2.5",
  "transformers>=4.51",
  "peft>=0.15,<1",
  "accelerate>=1,<2",
]
dev = [
  "pytest>=8,<10",
  "ruff>=0.9,<1",
]

[project.scripts]
tinywatch-grpo = "tinywatch_grpo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
