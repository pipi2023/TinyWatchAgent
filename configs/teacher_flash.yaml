# TinyWatch Flash teacher (AutoDL OpenAI-compatible)

model: ${TEACHER_MODEL:-deepseek-v4-flash}
base_url_env: TEACHER_BASE_URL
api_key_env: TEACHER_API_KEY

thinking: false
workers: 4
max_steps: 14
temperature: 0.0
max_tokens: 512
timeout: 120

reward_threshold: 0.55
target_accepted: 400
attempts_per_task: 1
validation_ratio: 0.2
seed: 42
